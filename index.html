:'Choose a valid route first.',deleted:'Removed from saved routes.',noSaved:'No saved routes yet.',remove:'Remove',chooseSaved:'Show route',liveIfAvailable:'Live times are shown only when provided by the source.',gpsPrivate:'GPS is only used for routing and is not saved.',uncertainStop:'Stop matched by transit provider:',failedStop:'This stop is not covered by the data source.',directions:'Direction',duration:'Duration',noInternet:'Check your connection and try again.',invalidDate:'Invalid departure time.'}

  function getLocal(key){try{return localStorage.getItem(key)}catch{return null}}
  function putLocal(key,value){try{localStorage.setItem(key,value)}catch{}}
  function svgIcon(id){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.classList.add('icon');const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+id);s.append(u);return s}
  function showToast(message){const e=$('statusBar');e.textContent=message;e.hidden=false;clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>e.hidden=true,5200)}
  function clock(){ $('localTime').textContent = new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()) }
  function localDateValue(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'Europe/Berlin',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()).replace(' ','T')}
  function fmtTime(value){if(!value)return '—'; const d=new Date(value);return Number.isNaN(d.getTime())?'—':new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/Berlin',hour:'2-digit',minute:'2-digit',hour12:false}).format(d)}
  function fmtMinutes(n){return `${n} ${tr('minutes')}`}
  function selectValues(){const from=$('from').value||'home',to=$('to').value||'zob',stop=$('stopSelect').value||'home';
    for(const [id,entries,selected] of [['from',['home','zob','aldi','uni','gps'],from],['to',['zob','aldi','uni','home','custom'],to],['stopSelect',['home','zob','aldi','uni'],stop]]){
      const select=$(id);select.replaceChildren();entries.forEach(k=>{const opt=document.createElement('option');opt.value=k;opt.textContent=P[k][lang];select.append(opt)});select.value=entries.includes(selected)?selected:entries[0]}
  }
  function languageRender(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('langToggle').textContent=lang==='ar'?'EN':'ع';$('langToggle').setAttribute('aria-label',lang==='ar'?'Switch to English':'التبديل إلى العربية');document.querySelectorAll('[data-t]').forEach(el=>{const text=tr(el.dataset.t);el.textContent=text});selectValues();renderShortcuts();sync();renderSaved();if(!$('tripResults').querySelector('.trip-card,.notice'))renderEmpty('tripResults','i-route','startSearch');if(!$('departureResults').querySelector('.departure-row,.notice'))renderEmpty('departureResults','i-depart','startDepartures');}
  function renderEmpty(target,icon,key){const container=$(target);container.replaceChildren();const d=document.createElement('div');d.className='empty-state';const p=document.createElement('p');p.textContent=tr(key);d.append(svgIcon(icon),p);container.append(d)}
  function sync(){const dest=$('to').value;$('customField').hidden=dest!=='custom';for(const b of $('shortcutList').querySelectorAll('button'))b.classList.toggle('selected',b.dataset.place===dest)}
  function renderShortcuts(){const list=$('shortcutList');list.replaceChildren();for(const key of ['zob','aldi','uni']){const b=document.createElement('button');b.type='button';b.className='shortcut';b.dataset.place=key;b.append(svgIcon(P[key].icon));const text=document.createElement('span');text.textContent=key==='uni'?(lang==='ar'?'الجامعة':'University'):(key==='aldi'?'ALDI':'ZOB');b.append(text);b.addEventListener('click',()=>{$('to').value=key;sync();changeView('journeys');searchJourneys()});list.append(b)}sync()}
  function changeView(view){currentView=view;for(const name of ['journeys','departures','saved'])$('view-'+name).hidden=name!==view;document.querySelectorAll('[data-view]').forEach(btn=>{const active=btn.dataset.view===view;btn.classList.toggle('active',active);if(active)btn.setAttribute('aria-current','page');else btn.removeAttribute('aria-current')});if(view==='saved')renderSaved();window.scrollTo({top:0,behavior:'instant'})}
  function setTimeMode(value){timeMode=value;$('timeNow').classList.toggle('selected',value==='now');$('timeLater').classList.toggle('selected',value==='later');$('timeNow').setAttribute('aria-pressed',String(value==='now'));$('timeLater').setAttribute('aria-pressed',String(value==='later'));$('timeField').hidden=value==='now';if(value==='later'&&!$('departureTime').value)$('departureTime').value=localDateValue()}
  function mapPlace(key){if(key==='gps')return gpsCoords?`${gpsCoords.latitude},${gpsCoords.longitude}`:null;if(key==='custom')return $('customAddress').value.trim()||null;return P[key]?.maps||null}
  function googleMapsUrl(walking=false){const origin=mapPlace($('from').value),dest=mapPlace($('to').value);if(!origin||!dest)return null;const q=new URLSearchParams({api:'1',origin,destination:dest,travelmode:walking?'walking':'transit'});if(!walking)q.set('transit_mode','bus');return `https://www.google.com/maps/dir/?${q.toString()}`}
  function openMaps(walking=false){const url=googleMapsUrl(walking);if(!url){showToast($('from').value==='gps'?tr('gpsRequired'):tr('customNeeded'));return}window.location.assign(url)}
  function validateRoute(){const from=$('from').value,to=$('to').value;if(from===to){showToast(tr('routeSame'));return false}if(from==='gps'&&!gpsCoords){showToast(tr('gpsRequired'));return false}if(to==='custom'&&!$('customAddress').value.trim()){showToast(tr('customNeeded'));return false}if(timeMode==='later'){const value=$('departureTime').value;if(!value||Number.isNaN(new Date(value).getTime())){showToast(tr('chooseLater'));return false}}return true}
  // Hardcoded Transitous stop IDs for predefined places
  const STOP_IDS = {

  async function apiFetch(url,signal){const r=await fetch(url,{signal,headers:{Accept:'application/json'}});if(!r.ok)throw new Error(`HTTP ${r.status}`);return r.json()}
  function placeParam(loc){if(loc.type==='stop')return loc.id;return `${loc.lat},${loc.lon}`}
  async function resolveLocation(key,signal){if(key==='gps'&&gpsCoords)return{type:'geo',lat:gpsCoords.latitude,lon:gpsCoords.longitude};if(STOP_IDS[key])return{type:'stop',id:STOP_IDS[key],name:P[key].en};if(key==='custom'){const addr=$('customAddress').value.trim();const cacheKey='custom:'+addr;if(locationCache.has(cacheKey))return locationCache.get(cacheKey);const url=new URL(`${API}/api/v1/geocode`);url.searchParams.set('text',addr+', Passau');const arr=await apiFetch(url,signal);if(!arr.length)throw new Error('Not found');const r=arr[0];const loc={type:'address',lat:r.lat,lon:r.lon,name:r.name};locationCache.set(cacheKey,loc);return loc}throw new Error('Unknown location key: '+key)}
  function setLoading(id,key){const holder=$(id);holder.replaceChildren();const d=document.createElement('div');d.className='empty-state';const spin=document.createElement('span');spin.className='loading-mark';spin.setAttribute('aria-hidden','true');const p=document.createElement('p');p.textContent=tr(key);d.append(spin,p);holder.append(d)}
  function showFailure(target,message){const holder=$(target);holder.replaceChildren();const d=document.createElement('div');d.className='notice';const strong=document.createElement('strong');strong.textContent=message;const p=document.createElement('p');p.textContent=tr('tryMaps');d.append(strong,p);holder.append(d)}
  function extraNote(container){const d=document.createElement('div');d.className='result-note';d.textContent=tr('apiSource');container.append(d)}
  function itineraryMapsUrl(item) {
    const legs = item.legs || [];
    const first = legs[0];
    const last  = legs[legs.length - 1];
    // Prefer lat/lon from leg endpoints (Transitous provides them)
    const oLat = first?.from?.lat, oLon = first?.from?.lon;
    const dLat = last?.to?.lat,   dLon = last?.to?.lon;
    if (!oLat || !dLat) return googleMapsUrl(false); // fallback to dropdowns
    const origin = `${oLat},${oLon}`;
    const dest   = `${dLat},${dLon}`;
    const q = new URLSearchParams({api:'1', origin, destination:dest, travelmode:'transit', transit_mode:'bus'});
    return `https://www.google.com/maps/dir/?${q}`;
  }
  function renderJourneys(items){const root=$('tripResults');root.replaceChildren();if(!items.length){showFailure('tripResults',tr('noJourneys'));return}for(const item of items.slice(0,6)){if(!item.legs?.length)continue;const legs=item.legs;const dep=item.startTime;const arr=item.endTime;const duration=item.duration?Math.round(item.duration/60):null;const transitLegs=legs.filter(l=>l.mode!=='WALK');const card=document.createElement('article');card.className='trip-card';card.setAttribute('role','button');card.setAttribute('tabindex','0');card.setAttribute('aria-label',tr('mapsTransit'));const mapsUrl=itineraryMapsUrl(item);card.addEventListener('click',()=>window.open(mapsUrl,'_blank','noopener'));card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();window.open(mapsUrl,'_blank','noopener')}});const top=document.createElement('div');top.className='trip-card-top';const times=document.createElement('div');times.className='trip-times';times.append(document.createTextNode(fmtTime(dep)));const sep=document.createElement('span');sep.className='thin';sep.textContent='—';times.append(sep,document.createTextNode(fmtTime(arr)));const meta=document.createElement('span');meta.className='trip-meta';meta.textContent=[duration!=null?fmtMinutes(duration):'',item.transfers>0?`${item.transfers} ${tr('transfers')}`:null].filter(Boolean).join('  ·  ');top.append(times,meta);const route=document.createElement('div');route.className='trip-route';for(let i=0;i<legs.length;i++){const leg=legs[i];if(i>0){const a=document.createElement('span');a.className='arrow';a.textContent='›';route.append(a)}const tag=document.createElement('span');if(leg.mode==='WALK'){tag.className='route-line walk';tag.textContent=tr('walkLeg')}else{tag.className='route-line bus';tag.textContent=leg.routeShortName||leg.displayName||leg.mode||'Bus'}route.append(tag)}const secondary=document.createElement('div');secondary.className='trip-secondary';const firstTransit=transitLegs[0];const lastTransit=transitLegs[transitLegs.length-1];const steps=[];if(firstTransit?.from?.name)steps.push(firstTransit.from.name);if(lastTransit?.to?.name)steps.push(lastTransit.to.name);secondary.textContent=steps.join('  →  ')||tr('liveIfAvailable');card.append(top,route,secondary);const hint=document.createElement('div');hint.className='trip-card-maps-hint';const pinSvg=svgIcon('i-external');pinSvg.style.width='12px';pinSvg.style.height='12px';hint.append(pinSvg,document.createTextNode(tr('mapsTransit')));card.append(hint);const cancelled=legs.some(l=>l.cancelled);if(cancelled){const s=document.createElement('div');s.className='trip-secondary trip-cancelled';s.textContent=tr('canceled');card.append(s)}root.append(card)}if(root.childElementCount===0){showFailure('tripResults',tr('noJourneys'));return}extraNote(root)}
  async function searchJourneys(){if(!validateRoute())return;changeView('journeys');journeysAbort?.abort();journeysAbort=new AbortController();const signal=journeysAbort.signal;setLoading('tripResults','looking');$('searchTrips').disabled=true;try{const[from,to]=await Promise.all([resolveLocation($('from').value,signal),resolveLocation($('to').value,signal)]);const url=new URL(`${API}/api/v1/plan`);url.searchParams.set('fromPlace',placeParam(from));url.searchParams.set('toPlace',placeParam(to));if(timeMode==='later')url.searchParams.set('time',new Date($('departureTime').value).toISOString());const data=await apiFetch(url,signal);if(signal.aborted)return;renderJourneys(data.itineraries||[])}catch(e){if(e.name==='AbortError')return;showFailure('tripResults',tr('apiUnavailable'))}finally{if(!signal.aborted)$('searchTrips').disabled=false}}
  function renderDepartures(items,stopName){const root=$('departureResults');root.replaceChildren();const buses=items.filter(x=>{const agency=(x.agencyName||'').toLowerCase();const mode=(x.mode||'').toUpperCase();return mode==='BUS'&&agency.includes('stadtwerke')});if(!buses.length){showFailure('departureResults',tr('noDepartures'));return}for(const dep of buses.slice(0,12)){const when=dep.place?.departure||dep.place?.scheduledDeparture;const row=document.createElement('div');row.className='departure-row';const time=document.createElement('div');time.className='dep-time';time.textContent=fmtTime(when);const badge=document.createElement('span');badge.className='dep-badge';badge.textContent=dep.routeShortName||dep.displayName||'Bus';const place=document.createElement('div');place.className='dep-direction';const name=document.createElement('strong');name.textContent=dep.headsign||'—';const small=document.createElement('small');small.textContent=stopName||'';place.append(name,small);row.append(time,badge,place);if(dep.cancelled||dep.place?.cancelled){const c=document.createElement('span');c.className='dep-delay';c.textContent=tr('canceled');row.append(c)}root.append(row)}extraNote(root)}
  async function loadDepartures(){depAbort?.abort();depAbort=new AbortController();const signal=depAbort.signal;const key=$('stopSelect').value;setLoading('departureResults','loadingDepartures');$('loadDepartures').disabled=true;$('departuresUpdated').textContent='';try{const stopId=STOP_IDS[key];if(!stopId)throw new Error('No stopId for '+key);const url=new URL(`${API}/api/v6/stoptimes`);url.searchParams.set('stopId',stopId);url.searchParams.set('n','25');const data=await apiFetch(url,signal);if(signal.aborted)return;renderDepartures(data.stopTimes||[],P[key].en);$('departuresUpdated').textContent=P[key].en||tr('apiData')}catch(e){if(e.name==='AbortError')return;showFailure('departureResults',tr('apiUnavailable'))}finally{if(!signal.aborted)$('loadDepartures').disabled=false}}
  function getSaved(){try{const a=JSON.parse(getLocal(STORAGE_ROUTES)||'[]');return Array.isArray(a)?a.filter(x=>P[x.from]&&P[x.to]&&x.to!=='gps'&&x.from!=='gps').slice(0,30):[]}catch{return []}}
  function saveRoute(){const from=$('from').value,to=$('to').value,custom=$('customAddress').value.trim();if(from===to||from==='gps'||(to==='custom'&&!custom)){showToast(tr('saveInvalid'));return}const saved=getSaved(),entry={from,to,custom:to==='custom'?custom:''};if(saved.some(x=>x.from===from&&x.to===to&&x.custom===entry.custom)){showToast(tr('alreadySaved'));return}saved.unshift(entry);putLocal(STORAGE_ROUTES,JSON.stringify(saved.slice(0,30)));renderSaved();showToast(tr('journeySaved'))}
  function renderSaved(){const root=$('savedList');root.replaceChildren();const entries=getSaved();if(!entries.length){renderEmpty('savedList','i-star','noSaved');return}entries.forEach((entry,index)=>{const row=document.createElement('div');row.className='saved-entry';const go=document.createElement('button');go.type='button';go.className='route-link';go.textContent=`${P[entry.from][lang]}  →  ${entry.to==='custom'?entry.custom:P[entry.to][lang]}`;go.addEventListener('click',()=>{$('from').value=entry.from;$('to').value=entry.to;$('customAddress').value=entry.custom||'';sync();changeView('journeys');searchJourneys()});const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label',tr('remove'));remove.addEventListener('click',()=>{const next=getSaved();next.splice(index,1);putLocal(STORAGE_ROUTES,JSON.stringify(next));renderSaved();showToast(tr('deleted'))});row.append(go,remove);root.append(row)})}
  function locate(){if(!window.isSecureContext){showToast(tr('gpsNeedsHttps'));return}if(!navigator.geolocation){showToast(tr('gpsNotSupported'));return}const b=$('locate');b.disabled=true;showToast(tr('gpsGetting'));navigator.geolocation.getCurrentPosition(p=>{gpsCoords={latitude:p.coords.latitude,longitude:p.coords.longitude};$('from').value='gps';b.disabled=false;showToast(tr('gpsFound'))},()=>{b.disabled=false;showToast(tr('gpsDenied'))},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})}
  function init(){selectValues();$('from').value='home';$('to').value='zob';$('stopSelect').value='home';$('departureTime').value=localDateValue();$('langToggle').addEventListener('click',()=>{lang=lang==='ar'?'en':'ar';putLocal(STORAGE_LANG,lang);languageRender()});$('swap').addEventListener('click',()=>{const f=$('from').value,t=$('to').value;if(t==='custom'){showToast(tr('saveInvalid'));return}if(f==='gps'){$('from').value=t;$('to').value='home'}else{$('from').value=t;$('to').value=f}sync()});$('locate').addEventListener('click',locate);$('from').addEventListener('change',sync);$('to').addEventListener('change',sync);$('journeyForm').addEventListener('submit',event=>{event.preventDefault();searchJourneys()});$('timeNow').addEventListener('click',()=>setTimeMode('now'));$('timeLater').addEventListener('click',()=>setTimeMode('later'));$('refreshTrips').addEventListener('click',searchJourneys);$('loadDepartures').addEventListener('click',loadDepartures);$('mapsTransit').addEventListener('click',()=>openMaps(false));$('mapsWalking').addEventListener('click',()=>openMaps(true));$('saveCurrent').addEventListener('click',saveRoute);document.querySelectorAll('[data-view]').forEach(btn=>btn.addEventListener('click',()=>changeView(btn.dataset.view)));languageRender();clock();setInterval(clock,30000)}
  init();
})();
